sonar.host.url=https://sonarcloud.io
sonar.organization=orshanski
sonar.projectKey=Orshanski_librarium-py

sonar.sources=backend/app,frontend/src
sonar.tests=backend/tests

sonar.python.version=3.11,3.12,3.13

# Тесты вынесены в sonar.exclusions: frontend-тесты живут внутри frontend/src, и без
# исключения сонар ловит на них bugs/code-smells как на проде (например, Array.sort без
# compare-функции в *.test.ts роняет reliability rating). Backend-тесты не входят в
# sonar.sources (там только backend/app), но добавлены сюда для симметрии и явности.
sonar.exclusions=**/node_modules/**,**/venv/**,**/__pycache__/**,**/dist/**,**/build/**,**/data/**,**/coverage/**,**/*.min.js,frontend/src/vendor/**,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/**/__tests__/**,frontend/src/test/**,backend/tests/**

# Coverage-исключения для файлов, которые остаются в анализе, но сами себя не покрывают
# (entrypoint, infra-скрипты). Тесты не нужно дублировать — они уже выкинуты из sonar.exclusions.
sonar.coverage.exclusions=frontend/src/main.tsx,frontend/src/vendor/**,backend/app/scripts/**

sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.python.coverage.reportPaths=backend/coverage.xml

sonar.scm.provider=git

# e1: Отключить python:S5332 (clear-text HTTP) на парсерах — там URL'ы это XMLNS identifiers
# (OPF, Dublin Core, FictionBook, XLink), не HTTP endpoints. Менять нельзя — это константы
# XML-стандартов.
#
# e2/e3: combobox.tsx — кастомный combobox с автодополнением и фильтрацией; нативные
# <select>/<datalist> такой UX не дают. С aria-activedescendant виртуальный фокус остаётся
# на input — option-элементам не нужно быть в tab-порядке, S6852 здесь противоречит
# ARIA combobox pattern.
#
# e4: desktop-book-edit-form.tsx — drop-zone это div с onClick/onDragOver/onDrop;
# заменить на <button> нельзя из-за drag-events и block-content внутри.
#
# e5/e6: tap-zone-editor.tsx — превью раскладки tap-зон ридера: 6 кликабельных
# ячеек в grid'е, клик циклит action. Это конфигуратор touch/mouse-инпута;
# замена на <button> ломает grid из-за UA-стилей, а tabbing по ячейкам
# бесполезен для keyboard-only юзера, у которого нет тач-устройства.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S5332
sonar.issue.ignore.multicriteria.e1.resourceKey=backend/app/parsers/*.py
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S6819
sonar.issue.ignore.multicriteria.e2.resourceKey=frontend/src/components/combobox.tsx
sonar.issue.ignore.multicriteria.e3.ruleKey=typescript:S6852
sonar.issue.ignore.multicriteria.e3.resourceKey=frontend/src/components/combobox.tsx
sonar.issue.ignore.multicriteria.e4.ruleKey=typescript:S6819
sonar.issue.ignore.multicriteria.e4.resourceKey=frontend/src/components/desktop/desktop-book-edit-form.tsx
sonar.issue.ignore.multicriteria.e5.ruleKey=typescript:S6848
sonar.issue.ignore.multicriteria.e5.resourceKey=frontend/src/components/tap-zone-editor.tsx
sonar.issue.ignore.multicriteria.e6.ruleKey=typescript:S1082
sonar.issue.ignore.multicriteria.e6.resourceKey=frontend/src/components/tap-zone-editor.tsx
